name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: software/backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check
        run: uv run --locked basedpyright

      - name: Test
        run: uv run --locked pytest
